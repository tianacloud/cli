name: Release CLI

on:
  workflow_dispatch:
    inputs:
      version:
        description: New npm version (for example 0.2.2-beta.0)
        required: true
        type: string
      npm_sha256:
        description: SHA-256 printed by the local upload-only command
        required: true
        type: string
      tag:
        description: npm distribution tag
        type: choice
        options: [latest, next]
        default: latest
      dry_run:
        description: Test and verify the uploaded npm package without publishing
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: cli-release
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/platforms.yml
    secrets: inherit

  publish:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install npm with trusted publishing support
        run: npm install --global npm@11.20.0
      - name: Download and verify the locally built npm package
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          NPM_SHA256: ${{ inputs.npm_sha256 }}
        run: |
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]
          [[ "$NPM_SHA256" =~ ^[a-fA-F0-9]{64}$ ]]
          mkdir -p dist/npm-release
          filename="tiana-cli-$RELEASE_VERSION.tgz"
          curl --fail --location --max-time 120 \
            "https://gitee.com/tianacloud/cli-releases/releases/download/v$RELEASE_VERSION/$filename" \
            --output "dist/npm-release/$filename"
          printf '%s  %s\n' "$NPM_SHA256" "dist/npm-release/$filename" | sha256sum --check
          tar -xOf "dist/npm-release/$filename" package/package.json > "$RUNNER_TEMP/release-package.json"
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const pkg = JSON.parse(readFileSync(process.env.RUNNER_TEMP + "/release-package.json"));
            if (pkg.name !== "@tianadb/cli" || pkg.version !== process.env.RELEASE_VERSION) {
              throw new Error("Downloaded npm package name or version does not match");
            }'
      - name: Publish npm using trusted publishing
        if: ${{ !inputs.dry_run }}
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: node scripts/publish-npm.mjs dist/npm-release "$RELEASE_VERSION" "$RELEASE_TAG"
      - name: Verify clean npm installation
        if: ${{ !inputs.dry_run }}
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          prefix="$(mktemp -d "$RUNNER_TEMP/tiana-npm-install.XXXXXX")"
          npm install --global --ignore-scripts=false --prefix "$prefix" --cache "$prefix/cache" "@tianadb/cli@$RELEASE_VERSION"
          "$prefix/bin/tiana" --version
