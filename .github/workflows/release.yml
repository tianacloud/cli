name: Release upload diagnostics
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Compare Gitee multipart uploads
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          node --input-type=module <<'JS'
          import { randomBytes } from 'node:crypto';
          import { writeFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const base='https://gitee.com/api/v5/repos/tianacloud/cli-releases/releases/1172873/attach_files';
          const headers={Authorization:`Bearer ${process.env.GITEE_TOKEN}`};
          for (const size of [64, 5*1024*1024]) {
            const form=new FormData();form.append('file',new Blob([randomBytes(size)]),'diagnostic-runner.bin');
            const start=Date.now();
            try {
              const r=await fetch(base,{method:'POST',headers,body:form,signal:AbortSignal.timeout(45000)});
              console.log(JSON.stringify({client:'fetch',size,status:r.status,seconds:(Date.now()-start)/1000}));
              if(r.ok) { const d=await r.json(); const del=await fetch(`${base}/${d.id}`,{method:'DELETE',headers,signal:AbortSignal.timeout(15000)}); console.log(JSON.stringify({cleanup:del.status})); }
            } catch(e) { console.log(JSON.stringify({client:'fetch',size,name:e.name,code:e.cause?.code,seconds:(Date.now()-start)/1000})); }
          }
          writeFileSync('/tmp/diagnostic-curl.bin',randomBytes(5*1024*1024));
          const config=`header = "Authorization: Bearer ${process.env.GITEE_TOKEN}"`;
          try {
            const output=execFileSync('curl',['--config','-','--silent','--show-error','--max-time','45','--form','file=@/tmp/diagnostic-curl.bin','--write-out','\n%{http_code} %{size_upload} %{speed_upload} %{time_total}',base],{input:config,encoding:'utf8',stdio:['pipe','pipe','pipe']});
            const index=output.lastIndexOf('\n');console.log(JSON.stringify({client:'curl',stats:output.slice(index+1)}));
            const d=JSON.parse(output.slice(0,index));
            if(d.id){ const del=await fetch(`${base}/${d.id}`,{method:'DELETE',headers,signal:AbortSignal.timeout(15000)}); console.log(JSON.stringify({cleanup:del.status})); }
          } catch(e){ console.log(JSON.stringify({client:'curl',exit:e.status,stats:e.stdout?.toString().split('\n').at(-1)})); }
          JS
