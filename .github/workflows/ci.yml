name: Public CLI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        go: ['1.25.x', 'stable']
    env:
      GOTOOLCHAIN: local
      GOPRIVATE: github.com/tianacloud/sdk-go,github.com/tianacloud/sdk-go-sqlite
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - name: Formatting
        run: test -z "$(gofmt -l .)"
      - name: Download private SDK dependencies
        env:
          SDK_READ_TOKEN: ${{ secrets.SDK_READ_TOKEN }}
          GIT_TERMINAL_PROMPT: '0'
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: credential.helper
          GIT_CONFIG_VALUE_0: ''
        run: |
          if [ -z "$SDK_READ_TOKEN" ]; then
            echo "::error::SDK_READ_TOKEN must grant read access to tianacloud/sdk-go and tianacloud/sdk-go-sqlite."
            exit 1
          fi
          export GIT_ASKPASS
          GIT_ASKPASS="$(mktemp "$RUNNER_TEMP/tiana-sdk-askpass.XXXXXX")"
          trap 'rm -f "$GIT_ASKPASS"' EXIT
          cat > "$GIT_ASKPASS" <<'SH'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' 'x-access-token' ;;
            *Password*) printf '%s\n' "$SDK_READ_TOKEN" ;;
            *) exit 1 ;;
          esac
          SH
          chmod 700 "$GIT_ASKPASS"
          go mod download
      - name: Test and vet
        run: |
          go test -mod=readonly -race -timeout 2m ./...
          go vet -mod=readonly ./...
      - name: Public source and CLI build
        run: |
          python3 scripts/test_public_source.py
          python3 scripts/test_uninstall_safety.py
          python3 scripts/check-public-source.py
          CGO_ENABLED=0 go build -mod=readonly -trimpath -o /tmp/tiana ./cmd/tiana
      - name: npm launchers and package fixtures
        run: node --test packaging/*.test.mjs
      - name: Module metadata
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
