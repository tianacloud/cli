name: Public CLI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        go: ['1.25.x', 'stable']
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: go.sum
      - name: Formatting
        run: test -z "$(gofmt -l .)"
      - name: Test and vet
        run: |
          go test -mod=readonly -race -timeout 2m ./...
          go vet -mod=readonly ./...
      - name: Public source and CLI build
        run: |
          python3 scripts/test_public_source.py
          python3 scripts/test_uninstall_safety.py
          python3 scripts/check-public-source.py
          CGO_ENABLED=0 go build -mod=readonly -trimpath -o /tmp/tiana ./cmd/tiana
      - name: npm launchers and package fixtures
        run: node --test packaging/*.test.mjs
      - name: Module metadata
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
